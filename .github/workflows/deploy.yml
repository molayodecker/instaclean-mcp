name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to promote to production
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: instaclean-mcp-production
  cancel-in-progress: false

jobs:
  production:
    name: production
    if: >-
      (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
      ||
      (
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Resolve commit
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ inputs.commit_sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a 40-character commit" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Require the commit on main with green CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main
          gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "test" or .name == "container")] | group_by(.name) | map(sort_by(.completed_at // "") | last) | .[] | [.name, .conclusion] | @tsv' \
            > /tmp/checks.tsv
          for job in test container; do
            if ! awk -v job="$job" '$1 == job && $2 == "success" { found = 1 } END { exit !found }' /tmp/checks.tsv; then
              echo "CI job ${job} has not succeeded for ${SHA}" >&2
              cat /tmp/checks.tsv >&2 || true
              exit 1
            fi
          done

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy production
        run: flyctl deploy --remote-only --ha=false --config fly.toml -a instaclean-mcp

      - name: Check production health
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://instaclean-mcp.fly.dev/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "production health check failed" >&2
          exit 1
