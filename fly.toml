app = "instaclean-mcp"
primary_region = "lhr"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  MITHRIL_API_URL = "https://api.tryinstaclean.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
